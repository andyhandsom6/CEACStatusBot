name: run main.py

on:
  push:
    branches:
      - main
      - ceac-repair-20261021  # Temporary diagnostic branch
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # At 00:00 on Monday

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: uv sync


      - name: Probe CEAC access using actual Chrome (repair branch only)
        if: github.ref == 'refs/heads/ceac-repair-20261021'
        run: |
          uv pip install --python .venv/bin/python playwright
          uv run python - <<'PY'
          import shutil
          from playwright.sync_api import sync_playwright
          print(f"Chrome path: {shutil.which('google-chrome') or shutil.which('chromium') or 'not installed'}", flush=True)
          with sync_playwright() as pw:
              for mode in ("headless", "headed"):
                  if mode == "headed" and not shutil.which("xvfb-run"):
                      print("headed mode unavailable (no xvfb-run)", flush=True)
                      continue
                  try:
                      browser = pw.chromium.launch(channel="chrome", headless=(mode == "headless"), args=["--no-sandbox"])
                      page = browser.new_page()
                      response = page.goto("https://ceac.state.gov/CEACStatTracker/Status.aspx?App=NIV", wait_until="domcontentloaded", timeout=30000)
                      page.wait_for_timeout(9000)
                      print(f"Chrome {mode}: http={response.status if response else None}, title={page.title()[:100]!r}, forms={page.locator('form').count()}, captcha_imgs={page.locator('img[id*=CaptchaImage]').count()}, dropdowns={page.locator('#Location_Dropdown').count()}", flush=True)
                      browser.close()
                  except Exception as exc:
                      print(f"Chrome {mode} error: {type(exc).__name__} {str(exc)[:220]}", flush=True)
                      break
          PY

      - name: Execute py script
        if: github.ref != 'refs/heads/ceac-repair-20261021'
        env:
          LOCATION: ${{ secrets.LOCATION }}
          NUMBER: ${{ secrets.NUMBER }}
          PASSPORT_NUMBER: ${{ secrets.PASSPORT_NUMBER }}
          SURNAME: ${{ secrets.SURNAME }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP: ${{ secrets.SMTP }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run trigger.py

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-artifact
          path: status_record.json
